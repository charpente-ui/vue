<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
    <!-- The mark from favicon.svg, without the dark tile: the navbar provides
         its own background. Colour matches the brand tone set in custom.css.
         Never write a double hyphen in here: XML forbids it inside a comment
         and the browser silently refuses to render the file. -->
    <g fill="#b84277">
        <rect width="12" height="12" x="0" y="0" rx="2"/>
        <rect width="12" height="12" x="16" y="0" rx="2" opacity="0.4"/>
        <rect width="12" height="12" x="32" y="0" rx="2"/>
        <rect width="12" height="12" x="0" y="16" rx="2" opacity="0.4"/>
        <rect width="12" height="12" x="16" y="16" rx="2"/>
        <rect width="12" height="12" x="32" y="16" rx="2" opacity="0.4"/>
        <rect width="12" height="12" x="0" y="32" rx="2"/>
        <rect width="12" height="12" x="16" y="32" rx="2" opacity="0.4"/>
        <rect width="12" height="12" x="32" y="32" rx="2"/>
    </g>
</svg>
