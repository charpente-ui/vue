name: CI

on:
  push:
    branches: [ "main", "develop", "beta" ]
  pull_request:
    branches: [ "main", "develop", "beta" ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # Every version the published `engines` field promises. fail-fast is off so
    # a break on one version still reports the others.
    strategy:
      fail-fast: false
      matrix:
        node: [ 20, 22, 24 ]

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      # Coverage rather than a plain run: the thresholds declared in
      # vitest.config.ts are only enforced by this script, so running `test`
      # here would leave them as a local-only convention.
      - name: Tests
        run: npm run test:coverage

      - name: Tests Reporter
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Tests (Node ${{ matrix.node }})
          path: junit.xml
          reporter: java-junit

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      # `npm run lint` passes --fix, which would rewrite the files and report
      # success on code that never was clean. CI checks, it does not repair.
      - name: ESLint
        run: npx eslint .

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Build
        run: npm run build

      # vite-plugin-dts is what type-checks the SFCs, and it can emit an empty
      # entry without failing the build. An unusable package would otherwise
      # only be discovered after publishing.
      - name: Check the declarations
        run: |
          test -s dist/index.js
          test -s dist/index.d.ts
          grep -q 'CButton' dist/index.d.ts

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Install Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E
        run: npm run test:e2e

      - name: Upload the traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [ test, lint, build, e2e ]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
